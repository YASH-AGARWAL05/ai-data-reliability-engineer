[project]
name = "ai-data-reliability-engineer"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.19.2",
    "dbt-core>=1.11,<1.12",
    "dbt-duckdb==1.11.1",
    "duckdb==1.5.6",
    "fastapi==0.120.2",
    "langgraph==1.2.20",
    "langgraph-checkpoint-sqlite==3.1.3",
    "openai==3.45.0",
    "psycopg[binary]==3.3.8",
    "pydantic>=2.14,<3",
    "sqlalchemy==2.1.8",
    "uvicorn==0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
  "bandit>=1.8",
  "import-linter>=2.15",
  "mypy==1.17.1",
  "mutmut>=3.3",
  "pre-commit>=4.3",
  "pytest>=8.4",
  "pytest-cov>=6.3",
  "ruff>=0.13",
  "semgrep>=1.140",
  "sqlfluff>=3.4",
  "vulture>=2.14",
  "httpx==0.28.1",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "docker/analytics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
pythonpath = ["src", "."]

[tool.coverage.run]
source = ["src"]

[tool.sqlfluff.core]
dialect = "duckdb"
templater = "jinja"
ignore = "templating"

[tool.bandit]
targets = ["src"]
