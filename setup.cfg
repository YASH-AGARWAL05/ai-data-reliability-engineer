[mutmut]
source_paths =
    src/ai_data_reliability
    docker
only_mutate =
    src/ai_data_reliability/investigator/sandbox.py
    docker/analytics/runner.py
    src/ai_data_reliability/investigator/graph.py
    src/ai_data_reliability/evaluation/scoring.py
also_copy = analytics
pytest_add_cli_args = -q
pytest_add_cli_args_test_selection =
    tests/test_guard_units.py
    tests/test_runner_units.py
    tests/test_graph_gate_units.py
    tests/test_evaluation.py
    tests/test_scorer_near_misses.py
on_dependency_change = rerun
timeout_multiplier = 2
timeout_constant = 1
