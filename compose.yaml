services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: reliability
      POSTGRES_DB: reliability
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reliability -d reliability"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - reliability_pgdata:/var/lib/postgresql/data

volumes:
  reliability_pgdata:
